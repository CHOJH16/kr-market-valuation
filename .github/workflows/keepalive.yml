name: 저장소 활동 유지

on:
  schedule:
    - cron: '30 2 */10 * *'     # 10일마다
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 하트비트 갱신
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/heartbeat.txt
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .keepalive/heartbeat.txt
          git commit -m "keepalive $(date -u +%Y-%m-%d)" || exit 0
          git push

      - name: 예약 실행 활성화 확인
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for wf in update.yml keepalive.yml; do
            gh api -X PUT \
              "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "$wf 활성" || echo "$wf 건너뜀"
          done
